name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, publish an artefact, mint an OIDC token for Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard — required files exist
        run: |
          set -e
          for f in index.html 404.html robots.txt site.webmanifest .nojekyll; do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          test -d assets/css && test -d assets/js && test -d assets/img || {
            echo "::error::missing asset directories"; exit 1; }

      - name: Guard — no root-absolute internal URLs
        run: |
          set -e
          # Root-absolute paths break on a GitHub Pages *project* site (/<repo>/).
          if grep -nE '(src|href)="/[^/]' index.html 404.html; then
            echo "::error::root-absolute URL found — must be relative"; exit 1
          fi
          if grep -nE 'url\(/[^/]' assets/css/style.css assets/css/fonts.css; then
            echo "::error::root-absolute CSS url() found — must be relative"; exit 1
          fi
          echo "all internal URLs are relative ✓"

      - name: Guard — no inline script, no third-party hosts
        run: |
          set -e
          inline=$(grep -c '<script' index.html || true)
          external=$(grep -c '<script[^>]*src=' index.html || true)
          echo "script tags: $inline (with src: $external)"
          if [ "$inline" != "$external" ]; then
            echo "::error::inline <script> found — CSP allows 'self' only"; exit 1
          fi
          if grep -nE 'https?://(fonts\.(googleapis|gstatic)|cdn\.|unpkg|jsdelivr|cdnjs)' index.html assets/css/*.css assets/js/*.js; then
            echo "::error::third-party asset host referenced"; exit 1
          fi

      - name: Guard — no secrets committed
        run: |
          set -e
          # --exclude-dir=.github: this very file contains the patterns it searches for,
          # so scanning the workflows directory is a guaranteed false positive.
          if grep -rInE '(ghp_[A-Za-z0-9]{20,}|github_pat_|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::credential-like string committed"; exit 1
          fi
          echo "no credentials detected ✓"

      - name: Stage site artefact
        run: |
          set -e
          mkdir -p _site
          cp -r index.html 404.html robots.txt sitemap.xml site.webmanifest .nojekyll \
                assets docs _site/
          du -sh _site
          # fail loudly if the shipped tree grows past a sane budget
          bytes=$(du -sb _site | cut -f1)
          echo "artefact bytes: $bytes"
          test "$bytes" -lt 12000000 || { echo "::error::artefact too large"; exit 1; }

      - uses: actions/configure-pages@v5
        with:
          # Bootstraps the Pages site with build_type=workflow when it does not exist
          # yet, so a fresh repository does not need a manual Settings toggle.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke test the deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live URL responds
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          url="${PAGE_URL:-https://juniorthanhbq.github.io/Old-Website-Restoration/}"
          echo "smoke testing $url"
          # The CDN can serve the previous deployment for a minute or so after
          # deploy-pages reports success, so poll before declaring failure.
          code=000
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            [ "$code" = "200" ] && break
            echo "  attempt $attempt: $code — waiting for Pages to publish"
            sleep 10
          done
          echo "index status: $code"
          test "$code" = "200" || { echo "::error::index returned $code"; exit 1; }
          for p in assets/css/style.css assets/css/fonts.css assets/js/main.js \
                   assets/fonts/fraunces.woff2 assets/fonts/inter.woff2 \
                   assets/img/hero-poster.webp robots.txt sitemap.xml 404.html; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "${url}${p}")
            echo "  $p -> $c"
            test "$c" = "200" || { echo "::error::$p returned $c"; exit 1; }
          done
          echo "deployment healthy ✓"
